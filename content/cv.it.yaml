summary: >
  Ingegnere robotico con oltre 10 anni in ABB sui robot collaborativi, dal supporto
  sul campo e i progetti cliente fino all'innovazione di prodotto. Guido la strategia
  tecnologica cobot e continuo a scrivere codice di produzione in RAPID e JavaScript —
  tra cui EasyRecord, oggi Add-In ufficiale ABB RobotWare, e le estensioni
  VS Code di ABB sul Marketplace. Sviluppo con AI coding agents (Claude Code, GitHub
  Copilot) lungo tutto il ciclo di sviluppo.

